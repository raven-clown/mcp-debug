name: Release

on:
  push:
    branches: [master]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: check
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.check.outputs.exists == 'false'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - if: steps.check.outputs.exists == 'false'
        run: bun install

      - if: steps.check.outputs.exists == 'false'
        run: bun run typecheck

      - if: steps.check.outputs.exists == 'false'
        run: bun test

      - if: steps.check.outputs.exists == 'false'
        run: bun run build

      # tag/release before publishing: a GitHub release can be deleted and
      # retried if something goes wrong, but an npm version, once published,
      # can never be reused - so npm is the step to fail last, not first
      - if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

      - if: steps.check.outputs.exists == 'false'
        run: |
          npm install -g npm@latest
          npm publish --access public
